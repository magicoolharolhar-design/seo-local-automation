services:
  - type: web
    name: seo-local-automation-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CONTENT_LANGUAGE
        value: pt-BR
    healthCheckPath: /api/health
